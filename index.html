<!DOCTYPE html>
<html>
<head>
<title>AI Shirt Designer</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px;}
input,select{width:100%;padding:8px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
#result{margin-top:20px;text-align:center;}
#result img{max-width:100%;border-radius:8px;}
#status{margin-top:10px;color:#666;font-size:13px;word-break:break-all;}
</style>
</head>
<body>
<h2>AI Shirt Designer</h2>
<input id="main" placeholder="Main text (e.g. FAMILY REUNION 2025)" />
<input id="sub" placeholder="Secondary text" />
<input id="icons" placeholder="Icons/elements (e.g. palm trees, stars)" />
<select id="style">
  <option value="digital_illustration|bold_fantasy">Bold</option>
  <option value="digital_illustration|street_art">Graffiti</option>
  <option value="digital_illustration|antiquarian">Vintage</option>
  <option value="vector_illustration|line_art">Minimal</option>
  <option value="digital_illustration|neon_calm">Retro</option>
  <option value="digital_illustration|graphic_intensity">Athletic</option>
</select>
<button onclick="generate()">Generate Design</button>
<div id="result"></div>
<div id="status"></div>

<script>
async function generate() {
  const main = document.getElementById('main').value.trim();
  if(!main) return alert('Please enter main text');
  document.getElementById('status').textContent = 'Generating... (15-25 seconds)';
  document.getElementById('result').innerHTML = '';
  try {
    const prompt = `Professional t-shirt graphic design. Main text "${main}". Secondary text "${document.getElementById('sub').value}". Icons: ${document.getElementById('icons').value}. Screen-print ready, high contrast, centered composition, apparel graphic.`;
    const styleParts = document.getElementById('style').value.split('|');
    const body = {
      prompt: prompt,
      style: styleParts[0],
      substyle: styleParts[1],
      model: 'recraftv3'
    };
    const resp = await fetch('https://ai-shirt-designer-api.vercel.app/api/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    console.log('Response:', JSON.stringify(data));
    if(data.data && data.data[0] && data.data[0].url) {
      document.getElementById('result').innerHTML = `<img src="${data.data[0].url}" />`;
      document.getElementById('status').textContent = 'Done!';
    } else {
      document.getElementById('status').textContent = 'Error: ' + JSON.stringify(data);
    }
  } catch(e) {
    document.getElementById('status').textContent = 'Error: ' + e.message;
  }
}
</script>
</body>
</html>
