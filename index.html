<!DOCTYPE html>
<html>
<head>
<title>AI Shirt Designer</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px;}
input{width:100%;padding:8px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px;font-size:14px;}
button{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
#result{margin-top:20px;text-align:center;}
#result img{max-width:100%;border-radius:8px;}
#status{margin-top:10px;color:#666;font-size:13px;}
</style>
</head>
<body>
<h2>AI Shirt Designer</h2>
<input id="main" placeholder="Main text (e.g. FAMILY REUNION 2025)" />
<input id="sub" placeholder="Secondary text" />
<button onclick="generate()">Generate Design</button>
<div id="status"></div>
<div id="result"></div>
<script>
async function generate() {
  var main = document.getElementById('main').value.trim();
  if(!main) { alert('Enter main text'); return; }
  document.getElementById('status').textContent = 'Generating... (15-20 seconds)';
  document.getElementById('result').innerHTML = '';
  var resp = await fetch('https://ai-shirt-designer-api.vercel.app/api/generate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      prompt: 'T-shirt graphic design, text says ' + main + ', ' + document.getElementById('sub').value + ', bold vector illustration, screen-print ready, high contrast',
      style: 'digital_illustration',
      model: 'recraftv3'
    })
  });
  var text = await resp.text();
  var data = JSON.parse(text);
  var parsed = typeof data.raw === 'string' ? JSON.parse(data.raw) : data;
  if(parsed.data && parsed.data[0] && parsed.data[0].url) {
    document.getElementById('result').innerHTML = '<img src="' + parsed.data[0].url + '"/>';
    document.getElementById('status').textContent = 'Done!';
  } else {
    document.getElementById('status').textContent = JSON.stringify(parsed);
  }
}
</script>
</body>
</html>
